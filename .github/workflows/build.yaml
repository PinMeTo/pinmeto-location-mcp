name: Build MCP Desktop Extension

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Install dependencies
        run: |
          npm install
          npm run build
          npm ci
          npm i @anthropic-ai/mcpb -g
      - name: Test
        run: npm run test
      - name: Build MCP Desktop Extension
        run: |
          npm install
          npm run build
          npm ci --production --ignore-scripts
          rm manifest.js
          mcpb pack
      - name: Upload mcpb file
        uses: actions/upload-artifact@v4
        with:
          name: pinmeto-mcp
          path: pinmeto-location-mcp.mcpb

  changeset-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check for changeset
        run: |
          # Release PRs (generated by `changeset version`) consume all
          # changesets and bump the version. They must not carry a changeset,
          # so skip the check whenever package.json's version differs from main.
          base_version=$(git show origin/main:package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          head_version=$(node -p 'require("./package.json").version')
          if [ "$base_version" != "$head_version" ]; then
            echo "Version bumped ($base_version -> $head_version); release PR, skipping changeset check."
            exit 0
          fi
          npx changeset status --since=origin/main
